apiVersion: eventing.knative.dev/v1
kind: Broker
metadata:
  name: autoscale-broker-a
  namespace: {{ .namespace }}
  annotations:
    eventing.knative.dev/broker.class: NatsJetStreamBroker
    autoscaling.eventing.knative.dev/class: keda.autoscaling.knative.dev
    autoscaling.eventing.knative.dev/min-scale: "0"
    autoscaling.eventing.knative.dev/max-scale: "2"
    autoscaling.eventing.knative.dev/polling-interval: "1"
    autoscaling.eventing.knative.dev/cooldown-period: "5"
    autoscaling.eventing.knative.dev/lag-threshold: "1"
---
apiVersion: eventing.knative.dev/v1
kind: Broker
metadata:
  name: autoscale-broker-b
  namespace: {{ .namespace }}
  annotations:
    eventing.knative.dev/broker.class: NatsJetStreamBroker
    autoscaling.eventing.knative.dev/class: keda.autoscaling.knative.dev
    autoscaling.eventing.knative.dev/min-scale: "0"
    autoscaling.eventing.knative.dev/max-scale: "2"
    autoscaling.eventing.knative.dev/polling-interval: "1"
    autoscaling.eventing.knative.dev/cooldown-period: "5"
    autoscaling.eventing.knative.dev/lag-threshold: "1"
