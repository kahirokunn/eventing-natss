apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: natsjetstream-broker-controller
  labels:
    nats.eventing.knative.dev/release: devel
rules:
  # Watch and update Brokers
  - apiGroups:
      - eventing.knative.dev
    resources:
      - brokers
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  # Update Broker status and finalizers
  - apiGroups:
      - eventing.knative.dev
    resources:
      - brokers/status
      - brokers/finalizers
    verbs:
      - update
  # Watch and update Triggers
  - apiGroups:
      - eventing.knative.dev
    resources:
      - triggers
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  # Update Trigger status and finalizers
  - apiGroups:
      - eventing.knative.dev
    resources:
      - triggers/status
      - triggers/finalizers
    verbs:
      - update
  # Create and manage events
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
      - update
  # Read broker config ConfigMaps from user namespaces (broker's own namespace).
  # Writes to the contract ConfigMap happen only in knative-eventing and are
  # covered by the namespaced Role in that namespace.
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
  # Manage deployments for ingress and filter
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
  # Wake a KEDA-managed filter from zero when the KEDA control plane is down.
  - apiGroups:
      - apps
    resources:
      - deployments/scale
    verbs:
      - get
      - update
  # Manage optional KEDA autoscaling for per-Broker filter deployments.
  - apiGroups:
      - keda.sh
    resources:
      - scaledobjects
    verbs:
      - get
      - create
      - update
      - delete
  # Manage services for ingress and filter
  - apiGroups:
      - "serving.knative.dev"
    resources:
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
  # Leader election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Manage service accounts for dataplane components
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Resolve the UID of each namespace before creating its shared OIDC delivery
  # ServiceAccount with a namespace owner reference.
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
  # Manage per-Broker bindings in user namespaces.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Bind only the namespaced filter reader and exact-name OIDC TokenRequest
  # ClusterRoles.
  # The `bind` verb allows creating bindings to this specific role without the
  # controller needing to hold every permission the role contains (prevents escalation).
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    resourceNames:
      - natsjetstream-broker-filter-reader
      - natsjetstream-broker-oidc-token-creator
    verbs:
      - bind
