apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: autoscale-trigger-a
  namespace: {{ .namespace }}
  annotations:
    natsjetstream.eventing.knative.dev/fetch-batch-size: "1"
    natsjetstream.eventing.knative.dev/max-concurrency: "1"
spec:
  broker: autoscale-broker-a
  subscriber:
    audience: https://eventing-natss-e2e.example
    ref:
      apiVersion: v1
      kind: Service
      name: autoscale-recorder-a
---
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: autoscale-trigger-b
  namespace: {{ .namespace }}
  annotations:
    natsjetstream.eventing.knative.dev/fetch-batch-size: "1"
    natsjetstream.eventing.knative.dev/max-concurrency: "1"
spec:
  broker: autoscale-broker-b
  subscriber:
    audience: https://eventing-natss-e2e.example
    ref:
      apiVersion: v1
      kind: Service
      name: autoscale-recorder-b
